name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]    # Run on pushes to main
  pull_request:
    branches: [ "main" ]    # Run on PRs targeting main
  schedule:
    - cron: '0 0 * * 0'     # Run every Sunday at midnight UTC

permissions:
  actions: read
  contents: read
  security-events: write     # Needed to upload CodeQL findings to GitHub

jobs:
  analyze:
    name: Analyze code with CodeQL
    runs-on: ubuntu-latest   # Runner environment
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ]  # CodeQL will run separately for each language

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}  # Use the language from the matrix
          # Optional: run custom queries
          # queries: security-extended

      # Step 3: Autobuild (only for compiled languages like C++, Java, C#)
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # Step 4: Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true    # Upload SARIF results to GitHub Security tab
